<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure - Privado</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg-color: #f8f9fc;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            margin: 0; 
            min-height: 100vh;
        }

        /* --- PANTALLA DE ENTRADA MODERNA --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        
        /* Capa oscura sobre la imagen de fondo */
        #login-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
        }

        .login-card {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 50px 30px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 380px;
            width: 85%;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .login-title { font-size: 28px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
        .login-desc { color: #4b4b4b; font-size: 15px; margin-bottom: 30px; }

        #passInput {
            width: 100%; padding: 18px; border: 1px solid #ddd; border-radius: 20px;
            font-size: 18px; text-align: center; outline: none; transition: 0.3s;
            background: white; box-sizing: border-box;
        }
        #passInput:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        /* --- APP PRINCIPAL --- */
        #app-content { display: none; }
        
        header { 
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 20px; text-align: center; font-size: 22px; font-weight: 700;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .container { max-width: 480px; margin: auto; padding: 20px; }

        .btn-post { 
            background: var(--primary); color: white; border: none; width: 100%; 
            padding: 18px; border-radius: 22px; font-weight: 700; cursor: pointer; 
            font-size: 16px; margin-bottom: 30px; display: block; text-align: center;
            box-shadow: 0 10px 20px -5px rgba(0,122,255,0.4);
        }

        .post { 
            background: white; border-radius: 28px; padding: 20px; margin-bottom: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #f0f0f0;
        }
        .post img { width: 100%; border-radius: 20px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 50px; margin-bottom: 15px;">🔒</div>
        <h2 class="login-title">Familia Yajure</h2>
        <p class="login-desc">Bienvenidos a nuestro espacio privado.</p>
        <input type="password" id="passInput" placeholder="Clave familiar">
    </div>
</div>

<div id="app-content">
    <header>🏠 Familia Yajure</header>
    <div class="container">
        <label for="fotoInput" class="btn-post">+ Compartir momento</label>
        <input type="file" id="fotoInput" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- DATOS MAESTROS (YA INTEGRADOS) ---
    const CLAVE_CORRECTA = "familia2026"; 
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 

    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');

    if(localStorage.getItem('familia_auth') === 'true') {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }

    passInput.oninput = () => {
        if(passInput.value.toLowerCase() === CLAVE_CORRECTA) {
            localStorage.setItem('familia_auth', 'true');
            location.reload();
        }
    };

    const fotoInput = document.getElementById('fotoInput');
    const muro = document.getElementById('muro');

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const mensaje = prompt("¿Qué quieres decir sobre esta foto?");
        const formData = new FormData();
        formData.append("image", file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
        const imgData = await res.json();
        if (imgData.success) {
            await addDoc(collection(db, "mensajes"), {
                texto: mensaje || "",
                foto: imgData.data.url,
                autor: "Tico",
                fecha: new Date()
            });
        }
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            muro.innerHTML += `
                <div class="post">
                    <p><strong>${data.autor}</strong> <span style="color:#8e8e93; font-size:0.9em;">acaba de subir:</span></p>
                    <p style="font-size:1.1em; color:#1d1d1f;">${data.texto}</p>
                    ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                </div>`;
        });
    });
</script>
</body>
</html>
