<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure - Álbum Privado</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --btn-green: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --glass: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; min-height: 100vh; color: var(--text-main);
            /* Fondo con más vida: Un degradado suave que no es blanco */
            background-color: #e2e8f0;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,85%,1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, hsla(225,39%,90%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,85%,1) 0, transparent 50%);
            background-attachment: fixed;
        }

        /* --- ENTRADA (ATARDECER) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); }

        .login-card {
            position: relative; background: var(--glass); backdrop-filter: blur(15px);
            padding: 40px 30px; border-radius: 35px; text-align: center; max-width: 340px; width: 85%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.4);
        }

        /* --- INTERIOR (VIDA Y MODERNISMO) --- */
        #app-content { display: none; }
        
        header { 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            padding: 18px 20px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05); position: relative;
        }
        .header-title { font-weight: 800; font-size: 20px; color: #4338ca; margin: 0; letter-spacing: -0.5px; }
        
        /* Botón Salir Elegante */
        .btn-logout { 
            position: absolute; right: 20px; background: #f1f5f9; color: #64748b; 
            border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 25px; 
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-logout:hover { background: #fee2e2; color: #ef4444; border-color: #fecaca; }

        .container { max-width: 480px; margin: auto; padding: 30px 20px; }

        /* Botón Subir con Sombra de Color */
        .btn-post { 
            background: var(--btn-green); color: white; border: none; width: 100%; 
            padding: 18px; border-radius: 25px; font-weight: 700; cursor: pointer; 
            font-size: 16px; margin-bottom: 35px; display: block; text-align: center;
            box-shadow: 0 12px 24px -6px rgba(16, 185, 129, 0.5); transition: 0.3s;
        }
        .btn-post:active { transform: scale(0.97); box-shadow: none; }

        /* Tarjetas estilo Instagram/iPhone */
        .post { 
            background: white; border-radius: 32px; padding: 22px; margin-bottom: 28px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.8);
            transition: 0.3s;
        }
        .post-author { font-weight: 800; color: #4338ca; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .post-text { font-size: 16px; color: #334155; line-height: 1.6; font-weight: 400; }
        .post img { width: 100%; border-radius: 24px; margin-top: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        #passInput { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 20px; font-size: 17px; text-align: center; outline: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 45px; margin-bottom: 15px;">🏡</div>
        <h2 style="margin:0 0 10px 0; font-weight:800; font-size:22px;">Bienvenido a Nuestros Recuerdos</h2>
        <p style="color:#64748b; font-size:14px; margin-bottom:25px;">Familia Yajure</p>
        <input type="password" id="passInput" placeholder="Clave secreta">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 class="header-title">Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">Salir 🔒</button>
    </header>
    <div class="container">
        <label for="fotoInput" class="btn-post">✨ Subir Nuevo Recuerdo</label>
        <input type="file" id="fotoInput" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_CORRECTA = "familia2026"; 
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 
    
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');
    const btnLogout = document.getElementById('btnLogout');

    if(localStorage.getItem('familia_auth') === 'true') {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }

    passInput.oninput = () => {
        if(passInput.value.toLowerCase() === CLAVE_CORRECTA) {
            localStorage.setItem('familia_auth', 'true');
            location.reload();
        }
    };

    btnLogout.onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    const fotoInput = document.getElementById('fotoInput');
    const muro = document.getElementById('muro');

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const mensaje = prompt("✍️ Escribe algo lindo para la familia:");
        const formData = new FormData();
        formData.append("image", file);
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
            const imgData = await res.json();
            if (imgData.success) {
                await addDoc(collection(db, "mensajes"), {
                    texto: mensaje || "",
                    foto: imgData.data.url,
                    autor: "Tico",
                    fecha: new Date()
                });
            }
        } catch (error) { alert("Error al subir la imagen."); }
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            muro.innerHTML += `
                <div class="post">
                    <div class="post-author">👤 ${data.autor}</div>
                    <div class="post-text">${data.texto}</div>
                    ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                </div>`;
        });
    });
</script>
</body>
</html>
