<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure - Recuerdos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #3b82f6;
            --dark-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; min-height: 100vh;
            background: var(--dark-bg);
            background-attachment: fixed;
            color: #f8fafc;
        }

        /* --- PANTALLA DE ENTRADA (EL ATARDECER) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); }

        .login-card {
            position: relative; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            padding: 40px 30px; border-radius: 35px; text-align: center; max-width: 340px; width: 85%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* --- INTERIOR DE LA APP (AZUL NOCHE) --- */
        #app-content { display: none; }
        
        header { 
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-title { font-weight: 800; font-size: 20px; color: white; margin: 0; letter-spacing: -0.5px; }
        
        .btn-logout { 
            position: absolute; right: 20px; 
            background: rgba(255,255,255,0.1); color: #94a3b8; 
            border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 12px; 
            font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-logout:hover { background: #ef4444; color: white; border-color: #ef4444; }

        .container { max-width: 480px; margin: auto; padding: 25px 15px; }

        /* BOTÓN AZUL MODERNO */
        .btn-post { 
            background: var(--accent-blue);
            color: white; border: none; width: 100%; 
            padding: 18px; border-radius: 22px; font-weight: 700; cursor: pointer; 
            font-size: 16px; margin-bottom: 30px; display: block; text-align: center;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); transition: 0.3s;
        }

        .post { 
            background: white; border-radius: 28px; padding: 20px; margin-bottom: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); color: #1e293b;
        }
        .post-author { font-weight: 800; color: var(--accent-blue); font-size: 14px; margin-bottom: 10px; }
        .post-text { font-size: 16px; line-height: 1.5; margin: 0; }
        .post img { width: 100%; border-radius: 22px; margin-top: 15px; display: block; }

        #passInput { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 18px; font-size: 17px; text-align: center; outline: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 45px; margin-bottom: 15px;">🌅</div>
        <h2 style="margin: 0 0 8px 0; font-size: 22px;">Bienvenido a Nuestros Recuerdos</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 30px;">Familia Yajure</p>
        <input type="password" id="passInput" placeholder="Clave de acceso">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 class="header-title">Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">Salir 🔒</button>
    </header>
    <div class="container">
        <label for="fotoInput" class="btn-post">✨ SUBIR NUEVO RECUERDO</label>
        <input type="file" id="fotoInput" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_CORRECTA = "familia2026"; 
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 
    
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');
    const btnLogout = document.getElementById('btnLogout');

    if(localStorage.getItem('familia_auth') === 'true') {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }

    passInput.oninput = () => {
        if(passInput.value.toLowerCase() === CLAVE_CORRECTA) {
            localStorage.setItem('familia_auth', 'true');
            location.reload();
        }
    };

    btnLogout.onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    const fotoInput = document.getElementById('fotoInput');
    const muro = document.getElementById('muro');

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const mensaje = prompt("¿Qué quieres decir sobre esta foto?");
        const formData = new FormData();
        formData.append("image", file);
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
            const imgData = await res.json();
            if (imgData.success) {
                await addDoc(collection(db, "mensajes"), {
                    texto: mensaje || "",
                    foto: imgData.data.url,
                    autor: "Tico",
                    fecha: new Date()
                });
            }
        } catch (e) { alert("Error al subir."); }
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            muro.innerHTML += `
                <div class="post">
                    <div class="post-author">👤 ${data.autor}</div>
                    <div class="post-text">${data.texto}</div>
                    ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                </div>`;
        });
    });
</script>
</body>
</html>
