<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure - Álbum Privado</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #10b981;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f8fafc; /* Fondo base limpio */
            margin: 0; min-height: 100vh; color: #1e293b;
        }

        /* --- PANTALLA DE ENTRADA CON EL ATARDECER --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Imagen del atardecer familiar que te gustó */
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        
        #login-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); /* Capa para que resalte la tarjeta */
        }

        .login-card {
            position: relative; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            padding: 45px 30px; border-radius: 35px; text-align: center; max-width: 360px; width: 85%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.4);
        }

        /* --- INTERIOR DE LA APP MODERNO --- */
        #app-content { 
            display: none; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eefe 100%); 
            min-height: 100vh;
        }
        
        header { 
            background: white; padding: 15px 20px; text-align: center;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header-title { font-weight: 800; font-size: 20px; color: var(--primary); margin: 0; }
        .btn-logout { background: #fee2e2; color: #ef4444; border: none; padding: 8px 15px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .container { max-width: 480px; margin: auto; padding: 25px 15px; }

        .btn-post { 
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; width: 100%; padding: 18px; border-radius: 22px;
            font-weight: 700; cursor: pointer; font-size: 16px; margin-bottom: 30px;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4); transition: 0.3s;
        }

        .post { 
            background: white; border-radius: 30px; padding: 20px; margin-bottom: 25px; 
            border: 1px solid #f1f5f9; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .post-author { font-weight: 700; color: var(--primary); font-size: 14px; margin-bottom: 8px; }
        .post-text { font-size: 16px; color: #334155; line-height: 1.5; }
        .post img { width: 100%; border-radius: 22px; margin-top: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        #passInput { width: 100%; padding: 15px; border: 1.5px solid #e2e8f0; border-radius: 18px; font-size: 18px; text-align: center; outline: none; }
        #passInput:focus { border-color: var(--primary); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 45px; margin-bottom: 10px;">🏡</div>
        <h2 style="margin: 0 0 8px 0; font-weight: 800;">Familia Yajure</h2>
        <p style="color:#64748b; font-size: 14px; margin-bottom: 30px;">Introduce la clave familiar</p>
        <input type="password" id="passInput" placeholder="Clave de acceso">
    </div>
</div>

<div id="app-content">
    <header>
        <div style="width: 70px;"></div>
        <h1 class="header-title">📸 Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">Salir</button>
    </header>
    <div class="container">
        <label for="fotoInput" class="btn-post">✨ Subir Nuevo Recuerdo</label>
        <input type="file" id="fotoInput" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_CORRECTA = "familia2026"; 
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 
    
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');
    const btnLogout = document.getElementById('btnLogout');

    if(localStorage.getItem('familia_auth') === 'true') {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }

    passInput.oninput = () => {
        if(passInput.value.toLowerCase() === CLAVE_CORRECTA) {
            localStorage.setItem('familia_auth', 'true');
            location.reload();
        }
    };

    btnLogout.onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    const fotoInput = document.getElementById('fotoInput');
    const muro = document.getElementById('muro');

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const mensaje = prompt("💬 Escribe algo sobre esta foto:");
        const formData = new FormData();
        formData.append("image", file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
        const imgData = await res.json();
        if (imgData.success) {
            await addDoc(collection(db, "mensajes"), {
                texto: mensaje || "",
                foto: imgData.data.url,
                autor: "Tico",
                fecha: new Date()
            });
        }
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            muro.innerHTML += `
                <div class="post">
                    <div class="post-author">👤 ${data.autor}</div>
                    <div class="post-text">${data.texto}</div>
                    ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                </div>`;
        });
    });
</script>
</body>
</html>
