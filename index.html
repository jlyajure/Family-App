<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; }
        header { background: #4267B2; color: white; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .post { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .post img { width: 100%; border-radius: 8px; margin-top: 10px; }
        .btn-post { background: #42b72a; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header>📸 Familia Yajure</header>

<div class="container">
    <label for="fotoInput" class="btn-post" style="display: block; text-align: center;">+ Subir Foto Familiar</label>
    <input type="file" id="fotoInput" accept="image/*">
    <div id="muro"><p style="text-align: center; color: gray;">Cargando momentos...</p></div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const fotoInput = document.getElementById('fotoInput');
    const muro = document.getElementById('muro');
    const IMGBB_KEY = "PON_AQUI_TU_LLAVE_DE_IMGBB"; // <-- PEGA TU LLAVE AQUÍ

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const mensaje = prompt("Escribe algo sobre esta foto:");
        
        // 1. Subir foto a ImgBB
        const formData = new FormData();
        formData.append("image", file);
        
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
            method: "POST",
            body: formData
        });
        const imgData = await res.json();
        
        // 2. Guardar link en Firebase
        if (imgData.success) {
            await addDoc(collection(db, "mensajes"), {
                texto: mensaje || "",
                foto: imgData.data.url,
                autor: "Tico",
                fecha: new Date()
            });
        }
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            muro.innerHTML += `
                <div class="post">
                    <p><strong>${data.autor}:</strong> ${data.texto}</p>
                    ${data.foto ? `<img src="${data.foto}">` : ""}
                </div>`;
        });
    });
</script>
</body>
</html>
