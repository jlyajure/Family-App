<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Familia Yajure - Recuerdos</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/emoji/32/000000/house-with-garden.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://img.icons8.com/emoji/16/000000/house-with-garden.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/160/000000/house-with-garden.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yajure">
    <meta name="theme-color" content="#1e293b">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* REGLA DE ORO: Evita que las cosas se descuadren */
        * { box-sizing: border-box; }

        :root { --accent-blue: #3b82f6; --dark-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); --wa-green: #25d366; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; min-height: 100vh; 
            background: var(--dark-bg); 
            background-attachment: fixed; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* --- PANTALLA DE ENTRADA --- */
        #login-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover; 
            display: flex; align-items: flex-start; justify-content: center; 
            z-index: 1000; padding-top: 100px; /* Subimos un poco más el cuadro */
        }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
        
        .login-card { 
            position: relative; 
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 40px 25px; 
            border-radius: 35px; 
            text-align: center; 
            max-width: 320px; 
            width: 90%; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); 
        }

        .login-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #fff; line-height: 1.2; }
        .login-card p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 25px; }

        /* BARRA DE CLAVE CORREGIDA */
        #passInput { 
            width: 100%; 
            padding: 18px; 
            border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 20px; 
            background: rgba(255,255,255,0.08); 
            color: white; 
            text-align: center; 
            font-size: 17px; 
            outline: none; 
            -webkit-appearance: none;
            transition: 0.3s;
        }
        #passInput::placeholder { color: rgba(255,255,255,0.4); }
        #passInput:focus { border-color: var(--accent-blue); background: rgba(255,255,255,0.12); }
        
        /* --- INTERIOR --- */
        #app-content { display: none; padding-bottom: 40px; }
        
        header { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(15px); 
            padding: 25px 20px 15px 20px; 
            position: sticky; top: 0; z-index: 100; 
            display: flex; justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-top: calc(30px + env(safe-area-inset-top)); 
        }
        
        .header-title { font-weight: 800; font-size: 18px; color: white; margin: 0; }
        .btn-logout { background: rgba(255,255,255,0.1); color: #94a3b8; border: 1px solid rgba(255,255,255,0.2); padding: 10px 16px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
        
        .container { max-width: 480px; margin: auto; padding: 20px 15px; }

        .btn-post { background: var(--accent-blue); color: white; border: none; width: 100%; padding: 14px; border-radius: 18px; font-weight: 700; cursor: pointer; font-size: 16px; margin-bottom: 20px; display: block; text-align: center; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3); }
        
        #wa-notice { display: none; background: var(--wa-green); color: white; padding: 15px; border-radius: 20px; text-align: center; font-weight: 800; text-decoration: none; margin-bottom: 25px; display: block; }

        /* TARJETAS */
        .post { background: white; border-radius: 28px; padding: 20px; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); color: #1e293b; position: relative; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .post-author { font-weight: 800; color: var(--accent-blue); font-size: 14px; }
        .post-date { font-size: 11px; color: #94a3b8; }
        .post img { width: 100%; border-radius: 20px; margin-top: 10px; display: block; }
        .btn-like { background: #fff5f5; color: #ff4757; border: 1px solid #ffecec; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; margin-top: 15px; border-top: 1px solid #f1f5f9; width: 100%; text-align: left; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 45px; margin-bottom: 15px;">🌅</div>
        <h2>Bienvenido a Nuestros Recuerdos</h2>
        <p>Familia Yajure</p>
        <input type="password" id="passInput" placeholder="Clave de acceso">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 class="header-title">Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">Salir 🔒</button>
    </header>
    
    <div class="container">
        <label for="fotoInput" class="btn-post">✨ SUBIR NUEVO RECUERDO</label>
        <input type="file" id="fotoInput" style="display:none;" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_NORMAL = "familia2026";
    const CLAVE_ADMIN = "ticoadmin2026"; 
    
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');
    const muro = document.getElementById('muro');

    if(localStorage.getItem('familia_auth')) {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }

    passInput.oninput = () => {
        const val = passInput.value.toLowerCase();
        if(val === CLAVE_NORMAL || val === CLAVE_ADMIN) {
            localStorage.setItem('familia_auth', val);
            location.reload();
        }
    };

    document.getElementById('btnLogout').onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((snapshotDoc) => {
            const data = snapshotDoc.data();
            const fecha = data.fecha ? data.fecha.toDate().toLocaleDateString('es-ES', { day:'numeric', month:'short' }) : "";
            muro.innerHTML += `
                <div class="post">
                    <div class="post-header"><span class="post-author">👤 ${data.autor}</span><span class="post-date">${fecha}</span></div>
                    <div>${data.texto}</div>
                    ${data.foto ? `<img src="${data.foto}">` : ""}
                    <button class="btn-like" onclick="window.darLike('${snapshotDoc.id}')">❤️ ${data.likes || 0}</button>
                </div>`;
        });
    });

    window.darLike = async (id) => {
        await updateDoc(doc(db, "mensajes", id), { likes: increment(1) });
    };
</script>
</body>
</html>
