<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure - Recuerdos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #3b82f6;
            --dark-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; min-height: 100vh;
            background: var(--dark-bg);
            background-attachment: fixed;
            color: #f8fafc;
        }

        /* --- PANTALLA DE ENTRADA (CRISTAL OSCURO) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }

        .login-card {
            position: relative; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 45px 35px; border-radius: 35px; text-align: center; max-width: 340px; width: 85%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .login-card h2 { color: white; margin: 0 0 10px 0; font-size: 24px; }
        .login-card p { color: rgba(255, 255, 255, 0.8); margin-bottom: 30px; }

        /* --- INTERIOR --- */
        #app-content { display: none; }
        
        header { 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-title { font-weight: 800; font-size: 18px; color: white; margin: 0; }
        
        .btn-logout { background: rgba(255,255,255,0.1); color: #94a3b8; border: 1px solid rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }

        .container { max-width: 480px; margin: auto; padding: 25px 15px; }

        /* Filtro de Miembros */
        .filter-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px; border-radius: 20px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .filter-label { font-size: 13px; font-weight: 600; color: #94a3b8; }
        #memberFilter {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 8px 12px; border-radius: 10px; outline: none; font-size: 14px;
        }

        .btn-post { 
            background: var(--accent-blue); color: white; border: none; width: 100%; 
            padding: 18px; border-radius: 22px; font-weight: 700; cursor: pointer; 
            font-size: 16px; margin-bottom: 30px; display: block; text-align: center;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        .post { background: white; border-radius: 28px; padding: 20px; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); color: #1e293b; }
        .post-author { font-weight: 800; color: var(--accent-blue); font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .post-text { font-size: 16px; line-height: 1.5; margin: 0; }
        .post img { width: 100%; border-radius: 22px; margin-top: 15px; display: block; }

        #passInput { width: 100%; padding: 16px; border: 2px solid rgba(255,255,255,0.2); border-radius: 18px; background: rgba(255,255,255,0.1); color: white; text-align: center; font-size: 18px; outline: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 45px; margin-bottom: 15px;">🌅</div>
        <h2>Bienvenido a Nuestros Recuerdos</h2>
        <p>Familia Yajure</p>
        <input type="password" id="passInput" placeholder="Clave de acceso">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 class="header-title">Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">Salir 🔒</button>
    </header>
    
    <div class="container">
        <div class="filter-section">
            <span class="filter-label">Ver recuerdos de:</span>
            <select id="memberFilter">
                <option value="todos">Toda la Familia</option>
                </select>
        </div>

        <label for="fotoInput" class="btn-post">✨ SUBIR NUEVO RECUERDO</label>
        <input type="file" id="fotoInput" accept="image/*">
        
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_CORRECTA = "familia2026"; 
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 
    
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');
    const btnLogout = document.getElementById('btnLogout');
    const memberFilter = document.getElementById('memberFilter');
    const muro = document.getElementById('muro');

    // Acceso
    if(localStorage.getItem('familia_auth') === 'true') {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }
    passInput.oninput = () => {
        if(passInput.value.toLowerCase() === CLAVE_CORRECTA) {
            localStorage.setItem('familia_auth', 'true');
            location.reload();
        }
    };
    btnLogout.onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    // Subir foto con identificación
    document.getElementById('fotoInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const nombre = prompt("👤 ¿Quién eres? (Tu nombre):");
        if (!nombre) return;
        
        const mensaje = prompt("✍️ Cuéntanos sobre esta foto (quiénes aparecen o qué pasó):");
        
        const formData = new FormData();
        formData.append("image", file);
        
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
            const imgData = await res.json();
            if (imgData.success) {
                await addDoc(collection(db, "mensajes"), {
                    texto: mensaje || "",
                    foto: imgData.data.url,
                    autor: nombre, // Guardamos el nombre real
                    fecha: new Date()
                });
            }
        } catch (e) { alert("Error al subir."); }
    };

    // Función para cargar el muro (Normal o Filtrado)
    let unsubscribe;
    function cargarMuro(filtroNombre = "todos") {
        if (unsubscribe) unsubscribe(); // Detener escucha anterior

        let q;
        if (filtroNombre === "todos") {
            q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
        } else {
            q = query(collection(db, "mensajes"), where("autor", "==", filtroNombre), orderBy("fecha", "desc"));
        }

        unsubscribe = onSnapshot(q, (snapshot) => {
            muro.innerHTML = "";
            const nombresUnicos = new Set();

            snapshot.forEach((doc) => {
                const data = doc.data();
                nombresUnicos.add(data.autor);
                
                muro.innerHTML += `
                    <div class="post">
                        <div class="post-author">👤 ${data.autor}</div>
                        <div class="post-text">${data.texto}</div>
                        ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                    </div>`;
            });

            // Actualizar el selector de nombres solo si estamos en vista "todos"
            if (filtroNombre === "todos") {
                actualizarSelector(nombresUnicos);
            }
        });
    }

    function actualizarSelector(nombres) {
        const valorActual = memberFilter.value;
        memberFilter.innerHTML = '<option value="todos">Toda la Familia</option>';
        nombres.forEach(nombre => {
            memberFilter.innerHTML += `<option value="${nombre}">${nombre}</option>`;
        });
        memberFilter.value = valorActual;
    }

    memberFilter.onchange = (e) => {
        cargarMuro(e.target.value);
    };

    // Iniciar
    cargarMuro();
</script>
</body>
</html>
