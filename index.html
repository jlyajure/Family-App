<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Familia Yajure - Recuerdos</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/emoji/32/000000/house-with-garden.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/160/000000/house-with-garden.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { --accent-blue: #3b82f6; --dark-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); --wa-green: #25d366; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; background: var(--dark-bg); background-attachment: fixed; color: #f8fafc; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover; display: flex; align-items: flex-start; justify-content: center; z-index: 1000; padding-top: 100px; }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
        .login-card { position: relative; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 40px 25px; border-radius: 35px; text-align: center; max-width: 320px; width: 90%; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        #passInput { width: 100%; padding: 18px; border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; background: rgba(255,255,255,0.08); color: white; text-align: center; font-size: 17px; outline: none; }
        
        #app-content { display: none; padding-bottom: 40px; }
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); padding: 25px 20px 15px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-top: calc(30px + env(safe-area-inset-top)); }
        .header-title { font-weight: 800; font-size: 18px; color: white; margin: 0; }
        .btn-logout { background: rgba(255,255,255,0.1); color: #94a3b8; border: 1px solid rgba(255,255,255,0.2); padding: 10px 16px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
        
        .container { max-width: 480px; margin: auto; padding: 20px 15px; }
        .btn-post { background: var(--accent-blue); color: white; border: none; width: 100%; padding: 14px; border-radius: 18px; font-weight: 700; cursor: pointer; font-size: 16px; margin-bottom: 20px; display: block; text-align: center; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3); }

        #wa-notice { display: none; background: var(--wa-green); color: white; padding: 15px; border-radius: 20px; text-align: center; font-weight: 800; text-decoration: none; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.02); } }

        .post { background: white; border-radius: 28px; padding: 20px; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); color: #1e293b; position: relative; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .post-author { font-weight: 800; color: var(--accent-blue); font-size: 14px; }
        .post-date { font-size: 11px; color: #94a3b8; }
        .btn-delete-admin { display: none; background: #ff4757; color: white; border: none; padding: 5px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }
        .post img { width: 100%; border-radius: 20px; margin: 10px 0; display: block; }
        .btn-like { background: #fff5f5; color: #ff4757; border: 1px solid #ffecec; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; text-align: left; }
        
        .comments-section { margin-top: 15px; background: #f8fafc; padding: 12px; border-radius: 18px; }
        .comment { font-size: 13px; margin-bottom: 6px; border-bottom: 1px solid #edf2f7; padding-bottom: 4px; }
        .comment b { color: var(--accent-blue); }
        .comment-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .comment-input { flex: 1; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; font-size: 13px; outline: none; }
        .btn-send-comment { background: var(--accent-blue); color: white; border: none; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 45px; margin-bottom: 15px;">🌅</div>
        <h2>Bienvenido a Nuestros Recuerdos</h2>
        <p>Familia Yajure</p>
        <input type="password" id="passInput" placeholder="Clave de acceso">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 class="header-title">Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">Salir 🔒</button>
    </header>
    <div class="container">
        <a id="wa-notice" href="#" target="_blank">📢 ¡AVISAR POR WHATSAPP!</a>
        <label for="fotoInput" id="labelPost" class="btn-post">✨ SUBIR NUEVO RECUERDO</label>
        <input type="file" id="fotoInput" style="display:none;" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot, updateDoc, doc, arrayUnion, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_NORMAL = "familia2026";
    const CLAVE_ADMIN = "ticoadmin2026";
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 

    const muro = document.getElementById('muro');
    const waNotice = document.getElementById('wa-notice');
    const labelPost = document.getElementById('labelPost');
    const fotoInput = document.getElementById('fotoInput');

    if(localStorage.getItem('familia_auth')) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
    }

    document.getElementById('passInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        if(val === CLAVE_NORMAL || val === CLAVE_ADMIN) {
            localStorage.setItem('familia_auth', val);
            location.reload();
        }
    };

    document.getElementById('btnLogout').onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const nombre = prompt("👤 Tu nombre:");
        if (!nombre) return;
        const mensaje = prompt("✍️ Cuéntanos sobre esta foto:");
        
        labelPost.innerHTML = "⏳ SUBIENDO...";
        labelPost.style.opacity = "0.5";
        
        try {
            const compressedFile = await compressImage(file);
            const formData = new FormData();
            formData.append("image", compressedFile);
            
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
            const imgData = await res.json();
            
            if (imgData.success) {
                await addDoc(collection(db, "mensajes"), {
                    texto: mensaje || "", foto: imgData.data.url, autor: nombre, fecha: new Date(), likes: 0, comentarios: []
                });
                
                // RESETEO DE BOTÓN ANTES DEL ALERT
                labelPost.innerHTML = "✨ SUBIR NUEVO RECUERDO";
                labelPost.style.opacity = "1";
                fotoInput.value = ""; 

                waNotice.href = `https://wa.me/?text=${encodeURIComponent('¡Nuevo recuerdo en nuestra App! 📸 ' + window.location.href)}`;
                waNotice.style.display = "block";
                
                // BAJAR AUTOMÁTICAMENTE PARA VER LA FOTO
                setTimeout(() => {
                    window.scrollTo({ top: labelPost.offsetTop + 100, behavior: 'smooth' });
                }, 500);

                alert("✅ ¡Foto publicada! Mira abajo para verla.");
            }
        } catch (err) { 
            alert("❌ Error: " + err.message); 
            labelPost.innerHTML = "✨ SUBIR NUEVO RECUERDO";
            labelPost.style.opacity = "1";
        }
    };

    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7);
                };
            };
        });
    }

    window.darLike = async (id) => await updateDoc(doc(db, "mensajes", id), { likes: increment(1) });
    window.enviarComentario = async (id) => {
        const input = document.getElementById(`input-${id}`);
        const nombre = prompt("👤 Tu nombre:");
        if (!input.value || !nombre) return;
        await updateDoc(doc(db, "mensajes", id), { comentarios: arrayUnion({ autor: nombre, texto: input.value }) });
        input.value = "";
    };
    window.borrarPost = async (id) => {
        if(confirm("⚠️ ¿ Sheriff Tico, borrar para siempre?")) await deleteDoc(doc(db, "mensajes", id));
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        const esAdmin = localStorage.getItem('familia_auth') === 'admin';
        snapshot.forEach((snapshotDoc) => {
            const data = snapshotDoc.data();
            const id = snapshotDoc.id;
            const fecha = data.fecha ? data.fecha.toDate().toLocaleDateString('es-ES', { day:'numeric', month:'short' }) : "";
            let comentariosHtml = data.comentarios ? data.comentarios.map(c => `<div class="comment"><b>${c.autor}:</b> ${c.texto}</div>`).join('') : "";

            muro.innerHTML += `
                <div class="post">
                    <div class="post-header">
                        <span class="post-author">👤 ${data.autor}</span>
                        <div>
                            <span class="post-date">${fecha}</span>
                            <button class="btn-delete-admin" style="display:${esAdmin ? 'inline-block' : 'none'}" onclick="borrarPost('${id}')">🗑️</button>
                        </div>
                    </div>
                    <div style="margin-bottom:10px;">${data.texto}</div>
                    ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                    <button class="btn-like" onclick="darLike('${id}')">❤️ ${data.likes || 0}</button>
                    <div class="comments-section">${comentariosHtml}
                        <div class="comment-input-group">
                            <input type="text" id="input-${id}" class="comment-input" placeholder="Opinar...">
                            <button class="btn-send-comment" onclick="enviarComentario('${id}')">Publicar</button>
                        </div>
                    </div>
                </div>`;
        });
    });
</script>
</body>
</html>
