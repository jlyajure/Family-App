<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Yajure - Recuerdos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; min-height: 100vh;
            /* AZUL CIELO SUAVE - Ahora sí notarás el cambio */
            background: linear-gradient(180deg, #bbd2f8 0%, #e2ebf0 100%);
            background-attachment: fixed;
            color: #1e293b;
        }

        /* --- BIENVENIDA --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }

        .login-card {
            position: relative; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 40px 30px; border-radius: 30px; text-align: center; max-width: 320px; width: 85%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- APP PRINCIPAL --- */
        #app-content { display: none; }
        
        header { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            border-bottom: 2px solid #3b82f6; position: relative;
        }
        .header-title { font-weight: 800; font-size: 19px; color: #1e3a8a; margin: 0; }
        
        /* Botón Salir Estilo Botón Real */
        .btn-logout { 
            position: absolute; right: 15px; 
            background: #ffffff; color: #ef4444; 
            border: 1px solid #fee2e2; padding: 6px 12px; border-radius: 12px; 
            font-size: 11px; font-weight: 700; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .container { max-width: 450px; margin: auto; padding: 25px 15px; }

        /* Botón Subir */
        .btn-post { 
            background: #10b981; color: white; border: none; width: 100%; 
            padding: 16px; border-radius: 20px; font-weight: 700; cursor: pointer; 
            font-size: 16px; margin-bottom: 25px; display: block; text-align: center;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* Tarjetas de Fotos (Ahora más cuadradas y ordenadas) */
        .post { 
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        .post-author { font-weight: 800; color: #3b82f6; font-size: 13px; margin-bottom: 5px; }
        .post-text { font-size: 15px; color: #334155; line-height: 1.4; margin: 0; }
        .post img { width: 100%; border-radius: 15px; margin-top: 12px; display: block; }

        #passInput { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 15px; font-size: 16px; text-align: center; outline: none; box-sizing: border-box; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 40px; margin-bottom: 10px;">🏡</div>
        <h2 style="margin:0 0 5px 0; font-size: 20px;">Bienvenido a Nuestros Recuerdos</h2>
        <p style="color:#64748b; font-size:13px; margin-bottom:20px;">Familia Yajure</p>
        <input type="password" id="passInput" placeholder="Introduce la clave">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 class="header-title">Familia Yajure</h1>
        <button class="btn-logout" id="btnLogout">CERRAR SESIÓN</button>
    </header>
    <div class="container">
        <label for="fotoInput" class="btn-post">📸 SUBIR NUEVA FOTO</label>
        <input type="file" id="fotoInput" accept="image/*">
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_CORRECTA = "familia2026"; 
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 
    
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const passInput = document.getElementById('passInput');
    const btnLogout = document.getElementById('btnLogout');

    if(localStorage.getItem('familia_auth') === 'true') {
        loginScreen.style.display = 'none';
        appContent.style.display = 'block';
    }

    passInput.oninput = () => {
        if(passInput.value.toLowerCase() === CLAVE_CORRECTA) {
            localStorage.setItem('familia_auth', 'true');
            location.reload();
        }
    };

    btnLogout.onclick = () => {
        localStorage.removeItem('familia_auth');
        location.reload();
    };

    const fotoInput = document.getElementById('fotoInput');
    const muro = document.getElementById('muro');

    fotoInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const mensaje = prompt("¿Qué quieres escribir en esta foto?");
        const formData = new FormData();
        formData.append("image", file);
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
            const imgData = await res.json();
            if (imgData.success) {
                await addDoc(collection(db, "mensajes"), {
                    texto: mensaje || "",
                    foto: imgData.data.url,
                    autor: "Tico",
                    fecha: new Date()
                });
            }
        } catch (e) { alert("Error al subir."); }
    };

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        muro.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            muro.innerHTML += `
                <div class="post">
                    <div class="post-author">👤 ${data.autor}</div>
                    <p class="post-text">${data.texto}</p>
                    ${data.foto ? `<img src="${data.foto}" loading="lazy">` : ""}
                </div>`;
        });
    });
</script>
</body>
</html>
