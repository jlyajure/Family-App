<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yajure App - V2.6</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.icons8.com/emoji/32/000000/house-with-garden.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { --accent-blue: #3b82f6; --dark-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); --wa-green: #25d366; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; background: var(--dark-bg); color: #f8fafc; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 30px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        #passInput { padding: 15px; border-radius: 15px; border: none; text-align: center; font-size: 18px; margin-top: 15px; outline: none; }
        #app-content { display: none; padding-bottom: 40px; }
        header { background: rgba(15, 23, 42, 0.9); padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .container { max-width: 480px; margin: auto; padding: 20px; }
        .btn-post { background: var(--accent-blue); color: white; padding: 18px; border-radius: 20px; font-weight: 800; cursor: pointer; text-align: center; display: block; margin-bottom: 10px; }
        
        /* MONITOR DE ESTADO */
        #status-msg { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 20px; min-height: 20px; }
        
        #wa-notice { display: none; background: var(--wa-green); color: white; padding: 18px; border-radius: 20px; text-align: center; font-weight: 800; text-decoration: none; margin-bottom: 25px; display: block; }
        .post { background: white; border-radius: 25px; padding: 20px; margin-bottom: 25px; color: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .post img { width: 100%; border-radius: 15px; margin-top: 10px; display: block; }
        .btn-delete { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div style="font-size: 40px;">🌅</div>
        <h2>Bienvenido</h2>
        <input type="password" id="passInput" placeholder="Clave">
    </div>
</div>

<div id="app-content">
    <header>
        <h1 style="font-size: 18px; margin:0;">Familia Yajure</h1>
        <button onclick="localStorage.clear(); location.reload();" style="background:none; border:none; color:#94a3b8; cursor:pointer;">Salir 🔒</button>
    </header>
    <div class="container">
        <a id="wa-notice" href="#" target="_blank">📢 ¡AVISAR POR WHATSAPP!</a>
        
        <label for="fotoInput" id="labelPost" class="btn-post">✨ SUBIR NUEVO RECUERDO</label>
        <div id="status-msg"></div> <input type="file" id="fotoInput" style="display:none;" accept="image/*">
        
        <div id="muro"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLAVE_NORMAL = "familia2026";
    const CLAVE_ADMIN = "ticoadmin2026";
    const IMGBB_KEY = "07dd4f0a1180673510c5047ae8b5eec8"; 

    const status = document.getElementById('status-msg');
    const label = document.getElementById('labelPost');

    if(localStorage.getItem('familia_auth')) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
    }

    document.getElementById('passInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        if(val === CLAVE_NORMAL || val === CLAVE_ADMIN) {
            localStorage.setItem('familia_auth', val);
            location.reload();
        }
    };

    document.getElementById('fotoInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const nombre = prompt("👤 Tu nombre:");
        const mensaje = prompt("✍️ Mensaje:");
        
        label.innerHTML = "⏳ PROCESANDO...";
        status.innerHTML = "🎨 Comprimiendo imagen...";
        
        try {
            // 1. COMPRESIÓN REAL
            const compressedBlob = await compressImage(file);
            
            status.innerHTML = "🚀 Subiendo a la nube (ImgBB)...";
            const formData = new FormData();
            formData.append("image", compressedBlob); // AHORA SÍ USA LA COMPRIMIDA
            
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
            const imgData = await res.json();
            
            if (imgData.success) {
                status.innerHTML = "📝 Guardando en Google (Firebase)...";
                
                await addDoc(collection(db, "mensajes"), {
                    texto: mensaje || "", 
                    foto: imgData.data.url, 
                    autor: nombre || "Anónimo", 
                    fecha: new Date()
                });
                
                status.innerHTML = "✅ ¡Listo! Foto publicada.";
                document.getElementById('wa-notice').style.display = "block";
                document.getElementById('wa-notice').href = `https://wa.me/?text=¡Nuevo+recuerdo!`;
            }
        } catch (err) { 
            status.innerHTML = "❌ Error: " + err.message;
            alert("Error: " + err.message);
        } finally {
            label.innerHTML = "✨ SUBIR NUEVO RECUERDO";
            document.getElementById('fotoInput').value = "";
        }
    };

    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 1000;
                    let w = img.width; let h = img.height;
                    if (w > MAX) { h *= MAX / w; w = MAX; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7);
                };
            };
        });
    }

    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        const muro = document.getElementById('muro');
        muro.innerHTML = "";
        const esAdmin = localStorage.getItem('familia_auth') === "ticoadmin2026";
        snapshot.forEach((d) => {
            const data = d.data();
            muro.innerHTML += `
                <div class="post">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>👤 ${data.autor}</b>
                        ${esAdmin ? `<button class="btn-delete" onclick="window.borrarPost('${d.id}')">🗑️</button>` : ""}
                    </div>
                    <p>${data.texto}</p>
                    <img src="${data.foto}">
                </div>`;
        });
    });

    window.borrarPost = async (id) => {
        if(confirm("¿Borrar?")) await deleteDoc(doc(db, "mensajes", id));
    };
</script>
</body>
</html>
